name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: System build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgeoip-dev
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r app/requirements.txt
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh
      - name: Python syntax
        run: python -m compileall -q app
      - name: Unit tests
        working-directory: app
        run: python -m unittest discover -s tests -v
